name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# description: Continuous Integration pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-code-quality:
        description: 'Check code quality?'
        required: false
        type: boolean
        default: false
      run-image-scan:
        description: 'Scan container image?'
        required: false
        type: boolean
        default: false

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

jobs:
  git-check:
    name: Git
    uses: ./.github/workflows/reusable-git-check.yml
    with:
      is-pull-request: ${{ github.event_name == 'pull_request' }}

  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@defde40cfcaa2dc67c1cc47a27d20605f76d74b0

  code-quality:
    name: Code
    needs: git-check
    if: needs.git-check.outputs.app_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-code-quality)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-dotnet-quality.yml@defde40cfcaa2dc67c1cc47a27d20605f76d74b0
    with:
      custom-commands: |
        echo "Install Playwright browser (chromium)"
        dotnet build --no-restore --configuration Debug test/BlazorApp.PlaywrightTests
        pwsh test/BlazorApp.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install chromium
        # The runner image has no sudo, so MongoDB comes from its tarball into the temporary directory instead of the apt package.
        echo "Install and start MongoDB 8.2"
        mkdir -p "${RUNNER_TEMP}/mongodb/bin" "${RUNNER_TEMP}/mongodb/data"
        curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.2.1.tgz |
          tar xz --strip-components=2 -C "${RUNNER_TEMP}/mongodb/bin" --wildcards "*/bin/mongod"
        "${RUNNER_TEMP}/mongodb/bin/mongod" --dbpath "${RUNNER_TEMP}/mongodb/data" --bind_ip 127.0.0.1 \
          --fork --logpath "${RUNNER_TEMP}/mongodb/mongod.log"
        timeout 30 bash -c "
          until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do
            echo 'MongoDB not ready yet, retrying in 1 second...'
            sleep 1
          done
        "
      dotnet-test-args: "--report-xunit-trx --coverage --coverage-output-format cobertura"
      extra-vars: |
        Application__IsHttpsRedirectionEnabled="false"
      fossa-enabled: false
      sonar-enabled: ${{ vars.SONAR_ORG != '' }}
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Todo Blazor
    secrets:
      fossa-api-key: ${{ secrets.FOSSA_API_KEY }}
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write

  image-scan:
    name: Image
    needs: git-check
    if: needs.git-check.outputs.app_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-image-scan)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@defde40cfcaa2dc67c1cc47a27d20605f76d74b0
    with:
      image-definition: "src/BlazorApp/Dockerfile"
      image-name: ${{ vars.CONTAINER_IMAGE_NAME }}
      image-path: ${{ vars.CONTAINER_REGISTRY_PATH }}
      image-tag: "${{ needs.git-check.outputs.version_major_minor }}.${{ github.run_id }}"
