name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# description: Continuous Integration pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-code-quality:
        description: 'Check code quality?'
        required: false
        type: boolean
        default: false
      run-image-scan:
        description: 'Scan container image?'
        required: false
        type: boolean
        default: false

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

jobs:
  git-check:
    name: Git
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      paths: 'src test Directory.Build.props Directory.Packages.props *.slnx global.json'
      version-file: Directory.Build.props
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de

  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de

  code-quality:
    name: Code
    needs: git-check
    if: needs.git-check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-code-quality)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-dotnet-quality.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      custom-commands: |
        echo "Install Playwright browser (chromium)"
        dotnet build --no-restore --configuration Debug test/BlazorApp.PlaywrightTests
        pwsh test/BlazorApp.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install chromium
      dotnet-test-args: "--report-xunit-trx --coverage --coverage-output-format cobertura"
      extra-vars: |
        Application__IsHttpsRedirectionEnabled="false"
      fossa-enabled: false
      mongodb-enabled: true
      sonar-enabled: ${{ vars.SONAR_ORG != '' }}
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Todo Blazor
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
    secrets:
      fossa-api-key: ${{ secrets.FOSSA_API_KEY }}
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write

  image-scan:
    name: Image
    needs: git-check
    if: needs.git-check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run-image-scan)
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      image-definition: "src/BlazorApp/Dockerfile"
      image-name: ${{ vars.CONTAINER_IMAGE_NAME }}
      image-path: ${{ vars.CONTAINER_REGISTRY_PATH }}
      image-tag: "${{ needs.git-check.outputs.version-major-minor }}.${{ github.run_id }}"
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
