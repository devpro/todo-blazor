# IstarCI configuration, read from the root of the repository.

runner:
  image: ghcr.io/devpro/ubuntu-dotnet:latest
  images:
    "git-check*": ghcr.io/devpro/debian-node:latest
    "markup-lint*": ghcr.io/devpro/debian-node:latest
  # The scan job builds an image and scans it through the host Docker daemon.
  docker: true

workflow:
  # The pipeline runs on a push to main only, so a local run on a feature branch names it instead of evaluating its triggers.
  file: .github/workflows/ci.yml

# Repository variables the pipeline reads, which a local run otherwise gets as placeholders, and an image tag refuses the uppercase in one.
vars:
  CONTAINER_REGISTRY_PATH: devprofr
